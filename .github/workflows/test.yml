name: tests

on:
  pull_request:
    branches:
      - "18.0*"
  push:
    branches:
      - "18.0"
      - "18.0-ocabot-*"

jobs:
  unreleased-deps:
    runs-on: ubuntu-latest
    name: Detect unreleased dependencies
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: |
          for reqfile in requirements.txt test-requirements.txt ; do
              if [ -f ${reqfile} ] ; then
                  result=0
                  # reject non-comment lines that contain a / (i.e. URLs, relative paths)
                  grep "^[^#].*/" ${reqfile} || result=$?
                  if [ $result -eq 0 ] ; then
                      echo "Unreleased dependencies found in ${reqfile}."
                      exit 1
                  fi
              fi
          done
  test:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      id-token: write
    container:
      image: ${{ matrix.container }}
      options: --init
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - container: ghcr.io/oca/oca-ci/py3.10-odoo18.0:latest
            name: test with Odoo
          - container: ghcr.io/oca/oca-ci/py3.10-ocb18.0:latest
            name: test with OCB
            makepot: "true"
    services:
      postgres:
        image: postgres:12.0
        env:
          POSTGRES_USER: odoo
          POSTGRES_PASSWORD: odoo
          POSTGRES_DB: odoo
        ports:
          - 5432:5432
    env:
      OCA_ENABLE_CHECKLOG_ODOO: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26.13.1"
      - name: Check the browser coverage collector
        shell: bash
        env:
          COVERAGE_FILE: ${{ runner.temp }}/collector.coverage
        run: |
          npm --prefix .github/coverage ci --ignore-scripts --no-audit --no-fund
          node --experimental-test-coverage --test --test-reporter=spec --test-reporter=lcov --test-reporter-destination=stdout --test-reporter-destination="$RUNNER_TEMP/collector-tools.lcov" .github/coverage/test-instrumentation.cjs
          coverage run --rcfile=.github/coverage/coverage.ini -m unittest discover -s .github/coverage -p 'test_*.py' -v
          coverage combine --rcfile=.github/coverage/coverage.ini --keep
          coverage xml --rcfile=.github/coverage/coverage.ini -o "$RUNNER_TEMP/collector-python.xml"
      - name: Instrument every maintained browser asset
        shell: bash
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          node - <<'JS'
          const assert = require('node:assert/strict');
          const path = require('node:path');
          const { execFileSync } = require('node:child_process');
          const { instrument, inventory } = require('./.github/coverage/instrument.cjs');
          const tooling = new Set(['eslint.config.cjs', 'prettier.config.cjs',
            '.github/coverage/instrument.cjs', '.github/coverage/merge.cjs',
            '.github/coverage/test-instrumentation.cjs']);
          const tracked = execFileSync('git', ['ls-files', '-z'], { encoding: 'utf8' }).split('\0').filter(Boolean);
          const assets = tracked.filter(file => /\.(?:[cm]?js|es6)$/.test(file)
            && !file.split('/').includes('tests') && !tooling.has(file));
          assert.deepEqual(assets.sort(), [...inventory['bank-statement-import']].sort(), 'Browser asset inventory changed');
          instrument('bank-statement-import', process.cwd(), path.join(process.env.RUNNER_TEMP, 'js-instrumentation'));
          JS
      - name: Install addons and dependencies
        run: oca_install_addons
      - name: Check licenses
        run: manifestoo -d . check-licenses
      - name: Check development status
        run: manifestoo -d . check-dev-status --default-dev-status=Beta
      - name: Initialize test db
        run: oca_init_test_database
      - name: Run tests
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/js-sessions"
          export PYTHONPATH="$GITHUB_WORKSPACE/.github/coverage${PYTHONPATH:+:$PYTHONPATH}"
          export OCA_JS_COVERAGE_DIR="$RUNNER_TEMP/js-sessions"
          export OCA_JS_COVERAGE_MAJOR=18
          oca_run_tests
          python .github/coverage/python_report.py "$GITHUB_WORKSPACE" "${COVERAGE_FILE:-.coverage}" coverage.xml
          node .github/coverage/merge.cjs bank-statement-import "$GITHUB_WORKSPACE" "$RUNNER_TEMP/js-instrumentation/inventory.json" "$RUNNER_TEMP/js-sessions" "$RUNNER_TEMP/js-report"
          for file in coverage.xml "$RUNNER_TEMP/collector-python.xml" "$RUNNER_TEMP/collector-tools.lcov" "$RUNNER_TEMP/js-report/lcov.info"; do
            test -s "$file"
          done
      - uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238 # v4
        with:
          use_oidc: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
          fail_ci_if_error: true
          disable_search: true
          files: coverage.xml,${{ runner.temp }}/collector-python.xml,${{ runner.temp }}/collector-tools.lcov,${{ runner.temp }}/js-report/lcov.info
      - name: Update .pot files
        run: oca_export_and_push_pot https://x-access-token:${{ secrets.GIT_PUSH_TOKEN }}@github.com/${{ github.repository }}
        if: ${{ matrix.makepot == 'true' && github.event_name == 'push' && github.repository_owner == 'OCA' }}
